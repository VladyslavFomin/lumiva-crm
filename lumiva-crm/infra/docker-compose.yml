version: '3.8'

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lumiva_crm_api
    env_file:
      - ../backend/.env
    environment:
      # Согласовано с volume ниже — иначе логотип и вложения теряются при пересборке контейнера (404 на /v1/uploads/...).
      UPLOADS_ROOT: /app/uploads
      # Куча Node ниже лимита контейнера: GC успевает до OOM-kill, утечка роняет только API (он перезапустится).
      NODE_OPTIONS: --max-old-space-size=768
    # Только localhost: снаружи API доступен через nginx (443), а не напрямую по :3000.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lumiva_crm_uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped
    mem_limit: 1g

  db:
    image: postgres:15
    container_name: lumiva_crm_db
    environment:
      POSTGRES_USER: lumiva
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: lumiva_crm
    # Только localhost: бэкенд сайта агентства (PM2, вне Docker) ходит сюда по 127.0.0.1 —
    # внутренний IP контейнера меняется при пересоздании сети и уже ломал сайт (DB_HOST=172.19.0.2).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lumiva_crm_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  lumiva_crm_db_data:
  lumiva_crm_uploads:
