# GitHub loads workflows only from the repository root: .github/workflows/
# (lumiva-crm/.github/workflows/ is not executed.)

name: Deploy Lumiva CRM

on:
  push:
    branches:
      - main
      - master
    paths:
      - "lumiva-crm/**"
      - ".github/workflows/deploy-crm.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CRM_HOST }}
          username: ${{ secrets.CRM_USER }}
          key: ${{ secrets.CRM_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Переходим в проект"
            cd ${{ secrets.CRM_PROJECT_PATH }}

            echo "==> Обновляем код из Git"
            git pull origin main || git pull origin master

            echo "==> Backend: install & build"
            cd backend
            npm ci
            npm run build

            echo "==> API: rebuild image"
            cd ../infra
            docker compose build api

            # Миграции — новым образом ДО перезапуска API: иначе новый код стартует на старой схеме (500 на отелях и др.).
            # Есть неприменённые — сначала копия БД в deploy-backups (только в этом случае: копия ~100 МБ).
            echo "==> DB: pending migrations"
            PENDING=$(docker compose run --rm --no-deps -T api npm run -s migration:show 2>/dev/null | grep -c '\[ \]' || true)
            echo "pending: ${PENDING:-0}"
            if [ "${PENDING:-0}" -gt 0 ]; then
              mkdir -p ../deploy-backups
              BACKUP="../deploy-backups/db-before-ci-$(date -u +%Y%m%d-%H%M%S).dump"
              docker exec lumiva_crm_db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP"
              test -s "$BACKUP"
              echo "backup: $BACKUP"
              docker compose run --rm --no-deps -T api npm run migration:run
            fi

            echo "==> API: restart"
            docker compose up -d api

            echo "==> Frontend: build SPA"
            cd ../frontend
            npm ci
            npm run build

            echo "==> Frontend: publish build to nginx webroot"
            bash scripts/deploy-live.sh  # keeps old assets 7 days so open tabs don't 404 into the error screen

            echo "==> CRM backend + frontend обновлены"
