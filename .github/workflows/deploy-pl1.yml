# GitHub loads workflows only from the repository root: .github/workflows/
# pl1 живёт на том же сервере, что и CRM — те же SSH-секреты CRM_* (PL1_* в репозитории не заданы).

name: Deploy PL1 Panel

on:
  push:
    branches:
      - main
      - master
    paths:
      - "pl1.lumiva-ui/**"
      - "admin-ui/**"
      - ".github/workflows/deploy-pl1.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CRM_HOST }}
          username: ${{ secrets.CRM_USER }}
          key: ${{ secrets.CRM_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Переходим в проект PL1"
            cd /root/pl1.lumiva-ui

            echo "==> Обновляем код из Git"
            git pull origin main || git pull origin master

            echo "==> Ставим зависимости и собираем"
            npm ci
            npm run build

            echo "==> Публикуем сборку в webroot nginx"
            rsync -a --delete dist/ /var/www/pl1.lumiva.agency/

            echo "==> PL1 панель обновлена"
