# SEO redirects for lumiva.agency
# HTTP → HTTPS and www → non-www are handled in SEPARATE server blocks OUTSIDE this file.
# Add these two server blocks to your nginx config (outside the main server { } block):
#
# server {
#     listen 80;
#     server_name lumiva.agency www.lumiva.agency;
#     return 301 https://lumiva.agency$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     server_name www.lumiva.agency;
#     # ssl_certificate / ssl_certificate_key here
#     return 301 https://lumiva.agency$request_uri;
# }
#
# Paste the block below INSIDE your main https://lumiva.agency server { } block (before try_files)

# ── E-commerce URL deduplication ─────────────────────────────────────────────
location ~* ^(/ru|/tr)?/services/development/e-commerce(/.*)?$ {
    set $lang $1;
    return 301 https://lumiva.agency$lang/services/development/ecommerce/;
}

# ── Old WordPress blog category redirects ─────────────────────────────────────
location ~* ^/category/blog(/.*)?$ {
    return 301 https://lumiva.agency/blog/;
}
location ~* ^/ru/category/blog(/.*)?$ {
    return 301 https://lumiva.agency/ru/blog/;
}
location ~* ^/tr/category/blog(/.*)?$ {
    return 301 https://lumiva.agency/tr/blog/;
}

# ── Old WordPress article redirects ──────────────────────────────────────────
location = /effektivnyj-marketing-s-n8n {
    return 301 https://lumiva.agency/ru/blog/;
}
location = /effektivnyj-marketing-s-n8n/ {
    return 301 https://lumiva.agency/ru/blog/;
}
location = /marketing-budjet-gostinichnogo-biznesa {
    return 301 https://lumiva.agency/ru/blog/;
}
location = /marketing-budjet-gostinichnogo-biznesa/ {
    return 301 https://lumiva.agency/ru/blog/;
}
location = /marketing-v-oteley-izuchite-ai {
    return 301 https://lumiva.agency/ru/blog/;
}
location = /marketing-v-oteley-izuchite-ai/ {
    return 301 https://lumiva.agency/ru/blog/;
}
location = /her-zaman-beklenenden-fazlasini-yapin {
    return 301 https://lumiva.agency/tr/blog/;
}
location = /her-zaman-beklenenden-fazlasini-yapin/ {
    return 301 https://lumiva.agency/tr/blog/;
}

# ── WooCommerce routes → 410 Gone ────────────────────────────────────────────
location ~* ^/(product-tag|product-category|product|shop|cart|checkout|my-account)(/.*)?$ {
    return 410;
}

# ── Legacy WooCommerce query URLs → 410 Gone ──────────────────────────────────
if ($arg_post_type = product) {
    return 410;
}

# ── WordPress admin/content → 410 ────────────────────────────────────────────
location ~* ^/(wp-admin|wp-content|wp-includes|wp-json)(/.*)?$ {
    return 410;
}

# ── SPA fallback (keep at the end of your location blocks) ───────────────────
